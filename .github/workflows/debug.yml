name: Debug

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Shell command to execute'
        required: true
        default: 'echo "Hello, World!"'

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Execute debug command
        run: |
          echo "=========================================="
          echo "Executing command: ${{ inputs.command }}"
          echo "=========================================="
          
          # Execute the command
          ${{ inputs.command }}
          
          EXIT_CODE=$?
          
          echo "=========================================="
          echo "Command exit code: $EXIT_CODE"
          echo "=========================================="
          
          # Exit with the same code as the command
          exit $EXIT_CODE
